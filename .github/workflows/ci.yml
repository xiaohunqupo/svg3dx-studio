# Build + deploy: npm packages only (no sibling checkouts / wasm-pack).
# Local full stack: `npm run build:all` (sets SVG3DX_USE_LOCAL=1).
name: CI

on:
  push:
    branches: [main, release/0.2.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Project Pages URL path: https://<owner>.github.io/svg3dx-studio/
  # Cloudflare custom domain at site root: set VITE_BASE=/ in that project instead.
  VITE_BASE: /svg3dx-studio/

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout svg3dx-studio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm ci
        run: npm ci

      - name: Build studio (SPA → Pages)
        run: npm run build

      - name: Build studio library (dist-lib)
        run: npm run build:lib

      # SPA fallback for vue-router history mode on static hosts
      - name: Prepare Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: svg3dx-studio-dist
          path: dist
          if-no-files-found: error

      - name: Upload lib artifact
        uses: actions/upload-artifact@v4
        with:
          name: svg3dx-studio-lib
          path: dist-lib
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/release/0.2.1' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/release/0.2.1' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
