# Build + deploy: npm packages only (no sibling checkouts / wasm-pack).
# Local full stack: `npm run build:all` (sets SVG3DX_USE_LOCAL=1).
name: CI

# Pages and the Copilot Worker both publish from RELEASE_BRANCH.
# Next release line: add the new branch under push.branches, then change RELEASE_BRANCH.
on:
  push:
    branches: [main, release/0.2.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Shared publish branch for GitHub Pages and the Cloudflare Copilot Worker.
  RELEASE_BRANCH: release/0.2.1
  # Project Pages URL path: https://<owner>.github.io/svg3dx-studio/
  # Cloudflare custom domain at site root: set VITE_BASE=/ in that project instead.
  VITE_BASE: /svg3dx-studio/
  # Copilot runtime is a Cloudflare Worker (see wrangler.jsonc). Pages cannot host it.
  VITE_COPILOT_RUNTIME_URL: https://copilot.dannyxu.net/api/copilotkit

jobs:
  # Job-level `if` cannot read env, so this job turns RELEASE_BRANCH into an output.
  release-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - id: gate
        run: |
          if [ "$GITHUB_REF_NAME" = "$RELEASE_BRANCH" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout svg3dx-studio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm ci
        run: npm ci

      - name: Build studio (SPA → Pages)
        run: npm run build

      - name: Build studio library (dist-lib)
        run: npm run build:lib

      # SPA fallback for vue-router history mode on static hosts
      - name: Prepare Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: svg3dx-studio-dist
          path: dist
          if-no-files-found: error

      - name: Upload lib artifact
        uses: actions/upload-artifact@v4
        with:
          name: svg3dx-studio-lib
          path: dist-lib
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.ref_name == env.RELEASE_BRANCH && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [build, release-check]
    if: needs.build.result == 'success' && needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-copilot:
    needs: [build, release-check]
    if: needs.build.result == 'success' && needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout svg3dx-studio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Deploy Copilot runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
